services:
  # ==========================================
  # 0. MESSAGE BROKER (RabbitMQ)
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: restaurantos-rabbitmq
    ports:
      - "5672:5672"       # AMQP Protocol (Services kết nối)
      - "15672:15672"     # RabbitMQ Management Web UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - restaurantos-net

  # ==========================================
  # 1. WEB FRONTEND (React 19 + Nginx)
  # ==========================================
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: restaurantos-web
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - gateway
    networks:
      - restaurantos-net

  # ==========================================
  # 2. API GATEWAY (YARP Reverse Proxy)
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: restaurantos-gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__employee-cluster__Destinations__destination1__Address=http://employee-service:5001
      - ReverseProxy__Clusters__schedule-cluster__Destinations__destination1__Address=http://schedule-service:5002
      - ReverseProxy__Clusters__finance-cluster__Destinations__destination1__Address=http://finance-service:5003
      - ReverseProxy__Clusters__ocr-cluster__Destinations__destination1__Address=http://ocr-service:5004
    depends_on:
      - employee-service
      - schedule-service
    networks:
      - restaurantos-net

  # ==========================================
  # 3. EMPLOYEE SERVICE (.NET 8 + SQL Server + RabbitMQ Publisher)
  # ==========================================
  employee-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.employee
    container_name: restaurantos-employee-service
    ports:
      - "${EMPLOYEE_SERVICE_HTTP_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__EmployeeDb=Server=host.docker.internal;Database=RestaurantOS_Employee;User Id=sa;Password=123;TrustServerCertificate=True;MultipleActiveResultSets=true
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - restaurantos-net

  # ==========================================
  # 4. SCHEDULE SERVICE (.NET 8 + SQLite + RabbitMQ Consumer)
  # ==========================================
  schedule-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.schedule
    container_name: restaurantos-schedule-service
    ports:
      - "${SCHEDULE_SERVICE_HTTP_PORT:-5002}:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ScheduleDb=Data Source=/app/data/schedule.db
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - schedule-data:/app/data
    networks:
      - restaurantos-net

  # ==========================================
  # 5. FINANCE SERVICE
  # ==========================================
  finance-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.finance
    container_name: restaurantos-finance-service
    ports:
      - "${FINANCE_SERVICE_HTTP_PORT:-5003}:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FinanceDb=Data Source=/app/data/finance.db
    volumes:
      - finance-data:/app/data
    networks:
      - restaurantos-net

  # ==========================================
  # 6. OCR SERVICE
  # ==========================================
  ocr-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.ocr
    container_name: restaurantos-ocr-service
    ports:
      - "${OCR_SERVICE_HTTP_PORT:-5004}:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OcrDb=Data Source=/app/data/ocr.db
    volumes:
      - ocr-data:/app/data
    networks:
      - restaurantos-net

networks:
  restaurantos-net:
    driver: bridge

volumes:
  employee-data:
  schedule-data:
  finance-data:
  ocr-data:
