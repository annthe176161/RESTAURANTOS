version: '3.8'

networks:
  restaurantos-net:
    driver: bridge

volumes:
  employee-data:
  schedule-data:
  finance-data:
  ocr-data:

services:
  # ==========================================
  # API GATEWAY (YARP)
  # ==========================================
  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: restaurantos-gateway
    ports:
      - "${GATEWAY_HTTP_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__employee-cluster__Destinations__destination1__Address=http://employee-service:5001
      - ReverseProxy__Clusters__schedule-cluster__Destinations__destination1__Address=http://schedule-service:5002
      - ReverseProxy__Clusters__finance-cluster__Destinations__destination1__Address=http://finance-service:5003
      - ReverseProxy__Clusters__ocr-cluster__Destinations__destination1__Address=http://ocr-service:5004
    depends_on:
      - employee-service
      - schedule-service
      - finance-service
      - ocr-service
    networks:
      - restaurantos-net

  # ==========================================
  # EMPLOYEE SERVICE
  # ==========================================
  employee-service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.employee
    container_name: restaurantos-employee-service
    ports:
      - "${EMPLOYEE_SERVICE_HTTP_PORT:-5001}:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__EmployeeDb=Data Source=/app/data/employee.db
    volumes:
      - employee-data:/app/data
    networks:
      - restaurantos-net

  # ==========================================
  # SCHEDULE SERVICE
  # ==========================================
  schedule-service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.schedule
    container_name: restaurantos-schedule-service
    ports:
      - "${SCHEDULE_SERVICE_HTTP_PORT:-5002}:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ScheduleDb=Data Source=/app/data/schedule.db
    volumes:
      - schedule-data:/app/data
    networks:
      - restaurantos-net

  # ==========================================
  # FINANCE SERVICE
  # ==========================================
  finance-service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.finance
    container_name: restaurantos-finance-service
    ports:
      - "${FINANCE_SERVICE_HTTP_PORT:-5003}:5003"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__FinanceDb=Data Source=/app/data/finance.db
    volumes:
      - finance-data:/app/data
    networks:
      - restaurantos-net

  # ==========================================
  # OCR SERVICE
  # ==========================================
  ocr-service:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.ocr
    container_name: restaurantos-ocr-service
    ports:
      - "${OCR_SERVICE_HTTP_PORT:-5004}:5004"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OcrDb=Data Source=/app/data/ocr.db
    volumes:
      - ocr-data:/app/data
    networks:
      - restaurantos-net
